[package]
name = "hallways-mobile"
version = "1.0.4"
edition = "2024"
publish = false
description = "Android and iPhone/iPad entry point for HALLWAYS"

[lib]
name = "hallways_mobile"
# cdylib: Android (loaded by GameActivity). staticlib: iOS (linked into the app).
crate-type = ["cdylib", "staticlib"]

[dependencies]
hallways = { path = ".." }
bevy = { version = "0.20.1", features = ["wav", "jpeg", "mp3", "android-game-activity"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = 3
