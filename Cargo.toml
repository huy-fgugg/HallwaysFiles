[package]
name = "hallways"
version = "1.2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["wav", "jpeg", "mp3"] }
# Microphone capture for voice chat (same version Bevy's audio already uses).
cpal = "0.17"
rand = "0.10.3"
rand_chacha = "0.10.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Online rooms: blocking WebSocket client on a background thread, TLS via rustls + ring.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.dev]
opt-level = 1
# Full debug info makes Bevy builds tens of GB; line tables are enough for backtraces.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Peer-to-peer rooms (computers only: phones never host and use the server relay).
[target.'cfg(not(target_os = "android"))'.dependencies]
webrtc = "0.21"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Android: asking for the microphone at runtime (voice chat).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
