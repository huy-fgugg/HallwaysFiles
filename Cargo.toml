[package]
name = "hallways"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["wav", "jpeg", "mp3"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1
# Full debug info makes Bevy builds tens of GB; line tables are enough for backtraces.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
