name: Release

# Builds the Windows zip and the Linux .deb and publishes them as a GitHub
# Release tagged v<version from Cargo.toml>. Runs when started by hand, or on
# a push whose commit message contains "[release]".
on:
  workflow_dispatch:
    inputs:
      lowend_for:
        description: "Only add Low-End Edition downloads to an existing release tag (e.g. v1.1.3); leave empty for a full release"
        required: false
        default: ""
      lowend_platforms:
        description: "Which Low-End Edition downloads to add (any of: windows linux android)"
        required: false
        default: "windows linux android"
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  check:
    if: (github.event_name == 'workflow_dispatch' && inputs.lowend_for == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Tests
        run: cargo test --release --lib
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.check.outputs.version }}"
          New-Item -ItemType Directory -Force HALLWAYS | Out-Null
          Copy-Item target\release\hallways.exe HALLWAYS\
          Copy-Item -Recurse assets HALLWAYS\assets
          Copy-Item packaging\windows\*.bat HALLWAYS\
          Compress-Archive -Path HALLWAYS -DestinationPath "hallways-$v-windows.zip" -Force
      - name: Package Low-End Edition
        shell: bash
        # Next to the normal zip, so both land at the top of the artifact.
        run: packaging/lowend/package.sh windows "${{ needs.check.outputs.version }}" && mv dist/*-windows-lowend.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: hallways-*-windows*.zip

  linux:
    needs: check
    # Older Ubuntu = older glibc, so the .deb installs on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Tests
        run: cargo test --release --lib
      - name: Build
        run: cargo build --release
      - name: Package .deb
        run: packaging/linux/build-deb.sh "${{ needs.check.outputs.version }}"
      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E "opt/hallways/hallways$|usr/bin/hallways|hallways.desktop"
      - name: Package Low-End Edition
        run: packaging/lowend/package.sh linux "${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*-linux-lowend.tar.gz

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: true
          cache-workspaces: mobile
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cd mobile
          cargo ndk -t arm64-v8a --platform 28 --link-libcxx-shared -o ../android/app/src/main/jniLibs build --release
      - name: Game assets
        run: cp -r assets android/app/src/main/assets
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "hallways-${{ needs.check.outputs.version }}-android.apk"
      - name: Low-End Edition APK
        run: |
          python3 -m pip install --quiet pillow
          python3 packaging/lowend/shrink.py android/app/src/main/assets 256
          (cd android && gradle --no-daemon assembleRelease -PlowEnd)
          cp android/app/build/outputs/apk/release/app-release.apk "hallways-${{ needs.check.outputs.version }}-android-lowend.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: hallways-*-android*.apk

  attach-apk:
    needs: [check, android, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: out/*

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: HALLWAYS ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            ## Downloads
            - **Windows:** `hallways-${{ needs.check.outputs.version }}-windows.zip`. Unzip it and run `HALLWAYS\hallways.exe`. On an older or integrated GPU, use `HALLWAYS (Low Graphics).bat`; if it still crashes, `HALLWAYS (Compatibility Mode).bat`. Windows may warn about an unknown app (it isn't code-signed): choose **More info → Run anyway**.
            - **Linux (Debian/Ubuntu):** `hallways_${{ needs.check.outputs.version }}_amd64.deb`. Install with `sudo apt install ./hallways_${{ needs.check.outputs.version }}_amd64.deb`, then start **HALLWAYS** from your app menu or run `hallways`.

            ### Low-End Edition (weak or old PCs)
            Smaller textures (a much smaller download and less video memory), Low graphics, a smaller window, fewer rooms loaded at once and no mirrors. Online play works with everyone else.
            - **Windows:** `hallways-${{ needs.check.outputs.version }}-windows-lowend.zip`. Unzip it and run `HALLWAYS (Low-End).bat`.
            - **Linux:** `hallways-${{ needs.check.outputs.version }}-linux-lowend.tar.gz`. Extract it and run `HALLWAYS-LowEnd/hallways-lowend.sh`.
            - **Android:** `hallways-${{ needs.check.outputs.version }}-android-lowend.apk` (added with the normal APK). Installs as its own app, **HALLWAYS Low-End**, next to the normal one.

            - **Android (phones/tablets, 64-bit, Android 9+):** `hallways-${{ needs.check.outputs.version }}-android.apk` (added a few minutes after the others). Download it on the phone, allow "install unknown apps" for your browser, and open it. Touch controls: left thumb walks, right thumb looks, buttons for USE / CROUCH / RUN / LIGHT / ITEM / MENU.

            Needs a graphics card with Vulkan (Linux/Android) or DirectX 12/Vulkan (Windows).

            ## Online rooms
            Host or join with a 5-letter room code (up to 4 players), with crossplay between Windows, Linux and Android.

            ## Your own music
            Drop a song into a folder in `assets/music/` (Windows: next to the exe; Linux: `/opt/hallways/assets/music/`).

  # Adds Low-End Edition downloads to an already published release (run by
  # hand with lowend_for = its tag). The game is built from that tag; the
  # packaging comes from this branch.
  lowend-backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.lowend_for != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-22.04
          - os: android
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      WANTED: ${{ contains(inputs.lowend_platforms, matrix.os) }}
    steps:
      - uses: actions/checkout@v4
        if: env.WANTED == 'true'
      - uses: actions/checkout@v4
        if: env.WANTED == 'true'
        with:
          ref: ${{ inputs.lowend_for }}
          path: game
      - name: System libraries
        if: env.WANTED == 'true' && matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: actions/setup-java@v4
        if: env.WANTED == 'true' && matrix.os == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: env.WANTED == 'true'
        with:
          toolchain: stable
          target: ${{ matrix.os == 'android' && 'aarch64-linux-android' || '' }}
          cache: true
          cache-workspaces: ${{ matrix.os == 'android' && 'game/mobile' || 'game' }}
      - name: Build
        if: env.WANTED == 'true' && matrix.os != 'android'
        working-directory: game
        run: cargo build --release
      - name: Package Low-End Edition
        if: env.WANTED == 'true' && matrix.os != 'android'
        shell: bash
        run: |
          v="${{ inputs.lowend_for }}"
          packaging/lowend/package.sh ${{ matrix.os }} "${v#v}" game
      - name: cargo-ndk
        if: env.WANTED == 'true' && matrix.os == 'android'
        run: cargo install cargo-ndk --locked
      - name: Android native library
        if: env.WANTED == 'true' && matrix.os == 'android'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cd game/mobile
          cargo ndk -t arm64-v8a --platform 28 --link-libcxx-shared -o ../android/app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        if: env.WANTED == 'true' && matrix.os == 'android'
        with:
          gradle-version: "8.11.1"
      - name: Android Low-End APK
        if: env.WANTED == 'true' && matrix.os == 'android'
        run: |
          v="${{ inputs.lowend_for }}"
          cp -r game/assets game/android/app/src/main/assets
          python3 -m pip install --quiet pillow
          python3 packaging/lowend/shrink.py game/android/app/src/main/assets 256
          # Older tags have no -PlowEnd switch: give the app its own id and name here.
          sed -i 's/applicationId "com.hallways.game"/applicationId "com.hallways.game.lowend"/' game/android/app/build.gradle
          sed -i 's/android:label="HALLWAYS"/android:label="HALLWAYS Low-End"/' game/android/app/src/main/AndroidManifest.xml
          (cd game/android && gradle --no-daemon assembleRelease -PlowEnd)
          mkdir -p dist
          cp game/android/app/build/outputs/apk/release/app-release.apk "dist/hallways-${v#v}-android-lowend.apk"
      # Upload with gh: editing an existing release through the API was
      # refused for this workflow's token, but adding files is allowed.
      - name: Add the files to the release
        if: env.WANTED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.lowend_for }}" dist/*-lowend.* --clobber -R "${{ github.repository }}"
      - name: Mention them in the release notes (best effort)
        if: env.WANTED == 'true' && matrix.os == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.lowend_for }}"
          notes="$(gh release view "$tag" -R "${{ github.repository }}" --json body -q .body)"
          if ! grep -q "Low-End Edition" <<<"$notes"; then
            printf '%s\n\n### Low-End Edition (weak or old PCs and phones)\nSmaller textures (a much smaller download and less memory) and Low graphics. Online play works with everyone else.\n- **Windows:** the `-windows-lowend.zip`. Unzip it and run `HALLWAYS (Low-End).bat`.\n- **Linux:** the `-linux-lowend.tar.gz`. Extract it and run `HALLWAYS-LowEnd/hallways-lowend.sh`.\n- **Android:** the `-android-lowend.apk`. Installs as its own app, **HALLWAYS Low-End**, next to the normal one.\n' "$notes" > notes.md
            gh release edit "$tag" -R "${{ github.repository }}" --notes-file notes.md || echo "Could not update the release notes (the files are uploaded)."
          fi
