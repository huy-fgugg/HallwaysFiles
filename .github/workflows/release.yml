name: Release

# Builds the Windows zip and the Linux .deb and publishes them as a GitHub
# Release tagged v<version from Cargo.toml>. Runs when started by hand, or on
# a push whose commit message contains "[release]".
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Tests
        run: cargo test --release --lib
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.check.outputs.version }}"
          New-Item -ItemType Directory -Force HALLWAYS | Out-Null
          Copy-Item target\release\hallways.exe HALLWAYS\
          Copy-Item -Recurse assets HALLWAYS\assets
          Copy-Item README.md, CREDITS.md HALLWAYS\
          Compress-Archive -Path HALLWAYS -DestinationPath "hallways-$v-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: hallways-*-windows.zip

  linux:
    needs: check
    # Older Ubuntu = older glibc, so the .deb installs on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Tests
        run: cargo test --release --lib
      - name: Build
        run: cargo build --release
      - name: Package .deb
        run: packaging/linux/build-deb.sh "${{ needs.check.outputs.version }}"
      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E "opt/hallways/hallways$|usr/bin/hallways|hallways.desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: HALLWAYS ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            ## Downloads
            - **Windows:** `hallways-${{ needs.check.outputs.version }}-windows.zip`. Unzip it and run `HALLWAYS\hallways.exe`. Windows may warn about an unknown app (it isn't code-signed): choose **More info → Run anyway**.
            - **Linux (Debian/Ubuntu):** `hallways_${{ needs.check.outputs.version }}_amd64.deb`. Install with `sudo apt install ./hallways_${{ needs.check.outputs.version }}_amd64.deb`, then start **HALLWAYS** from your app menu or run `hallways`.

            Needs a graphics card with Vulkan (Linux) or DirectX 12/Vulkan (Windows).

            ## Online rooms
            Host or join with a 5-letter room code (up to 4 players). The room server is in `server/` and deploys to Render with `render.yaml` (see README).

            ## Your own music
            Drop a song into a folder in `assets/music/` (Windows: next to the exe; Linux: `/opt/hallways/assets/music/`).
