name: iOS

# Builds an unsigned iPhone/iPad .ipa on a macOS runner and, when a release
# for the current version exists, attaches it. Runs when started by hand, or
# on a push whose commit message contains "[ios]" or "[release]".
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  ipa:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]') || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          cache: true
          cache-workspaces: mobile
          rustflags: ""
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build .ipa
        run: packaging/ios/build-ipa.sh "${{ steps.v.outputs.version }}" "hallways-${{ steps.v.outputs.version }}-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: hallways-*-ios.ipa
      - name: Attach to the release (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          for i in $(seq 1 40); do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" hallways-*-ios.ipa --clobber
              exit 0
            fi
            echo "waiting for release $tag ($i)"; sleep 30
          done
          echo "No release $tag yet; the .ipa is in this run's artifacts."
